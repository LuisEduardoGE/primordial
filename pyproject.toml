[project]
name = "primordial"
version = "0.1.0"
description = "Particles with neural-network brains that evolve through survival and reproduction."
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "pygame>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.6"]

[project.scripts]
primordial = "primordial.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["primordial"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["web"]

[tool.ruff.lint]
# Ruff's default rules, with three intentional patterns allowed.
ignore = [
  "SIM115",  # stats CSV files are opened only when a path is given and closed in a finally block
  "ISC004",  # report HTML is built from lists of multi-line implicitly concatenated strings
  "BLE001",  # VideoWriter falls back to GIF on any imageio/ffmpeg failure
]
