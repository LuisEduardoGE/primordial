[project]
name = "primordial"
version = "0.1.0"
description = "Particles with neural-network brains that evolve through survival and reproduction."
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "pygame>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
primordial = "primordial.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["primordial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
